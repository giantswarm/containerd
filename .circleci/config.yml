# Fork (giantswarm/containerd): hand-written, ours to keep (FORK.md,
# "Publishing"); nothing here is generated by devctl.
#
# Builds containerd, containerd-shim-runc-v2 and ctr for linux/amd64 as static
# binaries with containerd's own Makefile (STATIC=1, upstream's build tags and
# vendored modules) on every push to a branch of the line but `main`, and on
# every release tag. Only a release tag publishes: publish-release pushes the
# binaries to gsoci.azurecr.io/giantswarm/containerd as one OCI artifact (a
# single tar.gz layer holding bin/<binary>) under exactly CIRCLE_TAG, which
# must read v<X.Y.Z>-gs.<N> and sit on a commit of `giantswarm`, refuses a tag
# gsoci already has (published artifacts are immutable), and signs what it
# pushed with the organisation's CircleCI identity. No branch build gets the
# `architect` context, pushes or signs anything.
version: 2.1

orbs:
  architect: giantswarm/architect@10.10.0

jobs:
  build:
    docker:
      # Upstream's Go for the pin (.github/actions/install-go), from gsoci's mirror.
      - image: gsoci.azurecr.io/giantswarm/golang:1.26.9
    resource_class: large
    environment:
      GOTOOLCHAIN: local
    steps:
      - checkout
      - run:
          name: Version
          command: |
            set -o errexit -o nounset -o pipefail
            if [ -n "${CIRCLE_TAG:-}" ]; then
              .github/scripts/line-version.sh "${CIRCLE_TAG}" > .build_version
            else
              .github/scripts/line-version.sh dev "${CIRCLE_SHA1}" > .build_version
            fi
            echo "version $(cat .build_version)"
      - run:
          name: Build the static binaries
          command: |
            set -o errexit -o nounset -o pipefail
            VERSION=$(cat .build_version)
            make STATIC=1 VERSION="${VERSION}" REVISION="${CIRCLE_SHA1}" \
              bin/containerd bin/containerd-shim-runc-v2 bin/ctr
            for b in bin/containerd bin/containerd-shim-runc-v2 bin/ctr; do
              # A static executable has no program interpreter.
              if readelf -l "${b}" | grep -q 'INTERP'; then
                echo "ERROR: ${b} is dynamically linked" >&2
                exit 1
              fi
            done
            bin/containerd --version | grep -F " ${VERSION} ${CIRCLE_SHA1}"
            bin/ctr --version | grep -F " ${VERSION}"
            # Reproducible layer: fixed owner, order and mtime (the commit's).
            tar --create --gzip --file containerd-linux-amd64.tar.gz \
              --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="@$(git log -1 --format=%ct)" \
              bin/containerd bin/containerd-shim-runc-v2 bin/ctr
            tar --list --verbose --gzip --file containerd-linux-amd64.tar.gz
      - persist_to_workspace:
          root: .
          paths:
            - .build_version
            - containerd-linux-amd64.tar.gz

  publish-release:
    executor: architect/architect
    resource_class: small
    environment:
      REGISTRY: gsoci.azurecr.io/giantswarm/containerd
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Check the release's provenance
          command: |
            set -o errexit -o nounset -o pipefail
            tag="${CIRCLE_TAG:-}"
            if ! printf '%s\n' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-gs\.[0-9]+$'; then
              echo "ERROR: a release publishes a tag build of v<X.Y.Z>-gs.<N> only, not '${tag}'" >&2
              exit 1
            fi
            # A release is a commit of the line, never of another branch.
            git fetch --quiet origin +refs/heads/giantswarm:refs/remotes/origin/giantswarm
            if ! git merge-base --is-ancestor "${CIRCLE_SHA1}" origin/giantswarm; then
              echo "ERROR: tag ${tag} is on ${CIRCLE_SHA1}, which is not a commit of giantswarm" >&2
              exit 1
            fi
            # The binaries carry the version they are published under.
            if [ "$(cat .build_version)" != "${tag}" ]; then
              echo "ERROR: the binaries were built as $(cat .build_version), the tag is ${tag}" >&2
              exit 1
            fi
            echo "publishing ${REGISTRY}:${tag} from ${CIRCLE_SHA1}"
      - run:
          name: Push the OCI artifact
          command: |
            set -o errexit -o nounset -o pipefail
            tag="${CIRCLE_TAG}"
            ref="${REGISTRY}:${tag}"
            # oras writes ~/.docker/config.json, which cosign reads as well.
            printf '%s' "${ACR_GSOCI_PASSWORD}" | oras login gsoci.azurecr.io --username "${ACR_GSOCI_USERNAME}" --password-stdin
            # Published artifacts are immutable: an existing tag is refused,
            # never overwritten. Any answer but "not found" stops here too.
            if out=$(oras manifest fetch --descriptor "${ref}" 2>&1); then
              echo "ERROR: ${ref} exists already ($(printf '%s' "${out}" | jq -r '.digest')); published tags are never overwritten" >&2
              exit 1
            fi
            if ! printf '%s\n' "${out}" | grep -Eqi 'not ?found|manifest unknown'; then
              echo "ERROR: cannot tell whether ${ref} exists: ${out}" >&2
              exit 1
            fi
            out=$(oras push "${ref}" \
              --artifact-type application/vnd.giantswarm.containerd.binaries.v1 \
              --annotation "org.opencontainers.image.version=${tag}" \
              --annotation "org.opencontainers.image.revision=${CIRCLE_SHA1}" \
              --annotation "org.opencontainers.image.source=https://github.com/giantswarm/containerd" \
              --annotation "io.giantswarm.upstream.version=${tag%%-*}" \
              --annotation "io.giantswarm.platform=linux/amd64" \
              containerd-linux-amd64.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip)
            echo "${out}"
            digest=$(printf '%s\n' "${out}" | sed -n 's/^Digest: //p')
            test -n "${digest}"
            # Sign exactly what this job pushed under the tag.
            test "$(oras manifest fetch --descriptor "${ref}" | jq -r '.digest')" = "${digest}"
            echo "${REGISTRY}@${digest}" > /tmp/.cosign_refs
            echo "${ref}@${digest}" | tee artifact-ref.txt
      - architect/cosign-sign-verify
      - store_artifacts:
          path: artifact-ref.txt

workflows:
  build-and-publish:
    jobs:
      - build:
          # main is the mirror of upstream's main and carries no pipeline of
          # the line; a tag runs only as a release of the line.
          filters:
            branches:
              ignore: main
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+-gs\.[0-9]+$/
      # Tag builds only: the one job with the architect context.
      - publish-release:
          context: architect
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+-gs\.[0-9]+$/
